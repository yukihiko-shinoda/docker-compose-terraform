services:
  tenv:
    build:
      context: .
      args:
        # - futureys/claude-code-python-development - Docker Image
        #   https://hub.docker.com/r/futureys/claude-code-python-development/tags
        DOCKER_BASE_IMAGE: futureys/claude-code-python-development:20260906204000
        # - Releases · tofuutils/tenv
        #   https://github.com/tofuutils/tenv/releases
        TENV_VERSION: v4.15.1
        # - Releases · terraform-linters/tflint
        #   https://github.com/terraform-linters/tflint/releases
        TFLINT_VERSION: v0.64.0
        # - Releases · aquasecurity/trivy
        #   https://github.com/aquasecurity/trivy/releases
        TRIVY_VERSION: v0.74.0
        # - Releases · aws-cloudformation/cloudformation-guard
        #   https://github.com/aws-cloudformation/cloudformation-guard/releases
        GUARD_VERSION: 2.1.4
    # Claude Code's built-in Bash sandbox uses bubblewrap, which fails inside an
    # unprivileged container with "No permissions to create a new namespace" even
    # when the host kernel allows unprivileged user namespaces. CAP_SYS_ADMIN and
    # a permissive seccomp policy are the combination most commonly reported to
    # help bubblewrap create the namespaces it needs, though this is not always
    # sufficient -- see containers/bubblewrap#505 for cases where even a long list
    # of added capabilities still failed short of --privileged:
    # https://github.com/containers/bubblewrap/issues/505
    cap_add:
      - SYS_ADMIN
    image: futureys/tenv:development
    # Removes Docker's default seccomp filter, which otherwise blocks the unshare/mount/
    # pivot_root syscalls bubblewrap needs to build its sandbox even with CAP_SYS_ADMIN
    # granted above -- without it, every Bash tool call fails the same way it does without
    # cap_add (see the comment above cap_add).
    security_opt:
      - seccomp:unconfined
    environment:
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-northeast-1}
    # Docker Secrets, not env vars or a mounted file: aws-agent-session.sh writes
    # these under ~/.aws-agent-secrets/ on the HOST -- deliberately outside
    # /workspace, since the .:/workspace:cached mount below would otherwise expose
    # a repo-relative secrets directory as plain files inside the container too.
    # Compose mounts them read-only at /opt/claude-agent-secrets/* inside the
    # container (not the default /run/secrets/*, which Claude Code's own sandbox
    # keeps denied -- this environment is dedicated to Claude Code, so the
    # credential path is placed where the sandbox already allows it instead of
    # loosening that deny). The baked-in credential_process at
    # /root/.aws-agent-config/config (AWS_CONFIG_FILE; see Dockerfile,
    # aws-agent-credentials.sh) reads them from there. Never shows up in
    # `docker inspect` env output, unlike an environment: entry would.
    secrets:
      - source: aws_access_key_id
        target: /opt/claude-agent-secrets/aws_access_key_id
      - source: aws_secret_access_key
        target: /opt/claude-agent-secrets/aws_secret_access_key
      - source: aws_session_token
        target: /opt/claude-agent-secrets/aws_session_token
    volumes:
      - .:/workspace:cached
      - /workspace/.venv
      - ~/.claude:/root/.claude
      - ~/.claude.json:/root/.claude.json
secrets:
  aws_access_key_id:
    file: ${HOME}/.aws-agent-secrets/aws_access_key_id
  aws_secret_access_key:
    file: ${HOME}/.aws-agent-secrets/aws_secret_access_key
  aws_session_token:
    file: ${HOME}/.aws-agent-secrets/aws_session_token
