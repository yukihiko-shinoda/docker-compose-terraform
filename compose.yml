services:
  tenv:
    build:
      context: .
      args:
        # - futureys/claude-code-python-development - Docker Image
        #   https://hub.docker.com/r/futureys/claude-code-python-development/tags
        DOCKER_BASE_IMAGE: futureys/claude-code-python-development:20260916202000
        # - Releases · tofuutils/tenv
        #   https://github.com/tofuutils/tenv/releases
        TENV_VERSION: v4.15.1
        # - Releases · terraform-linters/tflint
        #   https://github.com/terraform-linters/tflint/releases
        TFLINT_VERSION: v0.64.0
        # - Releases · aquasecurity/trivy
        #   https://github.com/aquasecurity/trivy/releases
        TRIVY_VERSION: v0.74.0
        # - Releases · aws-cloudformation/cloudformation-guard
        #   https://github.com/aws-cloudformation/cloudformation-guard/releases
        GUARD_VERSION: 2.1.4
        # - Cloud SDK release notes  |  Google Cloud CLI Documentation
        #   https://cloud.google.com/sdk/docs/release-notes
        GCLOUD_VERSION: 584.0.0
        # - Releases · googleworkspace/cli
        #   https://github.com/googleworkspace/cli/releases
        GWS_VERSION: 0.22.5
    image: futureys/tenv:development
    environment:
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-northeast-1}
    # Docker Secrets, not env vars or a mounted file: aws-agent-session.sh writes
    # these under ~/.aws-agent-secrets/ on the HOST -- deliberately outside
    # /workspace, since the .:/workspace:cached mount below would otherwise expose
    # a repo-relative secrets directory as plain files inside the container too.
    # Compose mounts them read-only at /opt/claude-agent-secrets/* inside the
    # container (not the default /run/secrets/*, which Claude Code's own sandbox
    # keeps denied -- this environment is dedicated to Claude Code, so the
    # credential path is placed where the sandbox already allows it instead of
    # loosening that deny). The baked-in credential_process at
    # /root/.aws-agent-config/config (AWS_CONFIG_FILE; see Dockerfile,
    # aws-agent-credentials.sh) reads them from there. Never shows up in
    # `docker inspect` env output, unlike an environment: entry would.
    secrets:
      # Mounted at /opt/claude-agent-secrets/, not the default /run/secrets/,
      # so git-agent-credential-helper.sh (see Dockerfile) can read it from
      # inside Claude Code's own Bash sandbox, which keeps /run/secrets
      # denied but allow-lists /opt/claude-agent-secrets/*.
      - source: git_auth_secret
        target: /opt/claude-agent-secrets/git_auth_token
      - source: slack_webhook_url
      - source: aws_access_key_id
        target: /opt/claude-agent-secrets/aws_access_key_id
      - source: aws_secret_access_key
        target: /opt/claude-agent-secrets/aws_secret_access_key
      - source: aws_session_token
        target: /opt/claude-agent-secrets/aws_session_token
      # Static claude-code service account key, minted on the host by
      # gcp-agent-key.sh into ~/.gcp-agent-secrets/ -- placed in the same
      # container directory as the AWS secrets above so Claude Code's own
      # Bash sandbox, which already denies reading /opt/claude-agent-secrets
      # except for the three AWS files explicitly allow-listed there, denies
      # this file too without any sandbox config change.
      - source: gcp_claude_code_key
        target: /opt/claude-agent-secrets/claude-code-key.json
    # Claude Code's built-in Bash sandbox uses bubblewrap, which needs the unshare/mount/
    # pivot_root syscalls to build its sandbox -- Docker's default seccomp filter blocks
    # those, so it's removed here. CAP_SYS_ADMIN was also added alongside this at first
    # (containers/bubblewrap#505 reports it as commonly needed too), but this host's
    # kernel allows unprivileged user namespaces without it, so it was dropped once that
    # was confirmed working:
    # https://github.com/containers/bubblewrap/issues/505
    security_opt:
      - seccomp:unconfined
    volumes:
      - .:/workspace:cached
      - /workspace/.venv
      - ~/.claude:/root/.claude
      - ~/.claude.json:/root/.claude.json
secrets:
  git_auth_secret:
    environment: GIT_AUTH_TOKEN
  slack_webhook_url:
    environment: SLACK_WEBHOOK_URL
  aws_access_key_id:
    file: ${HOME}/.aws-agent-secrets/aws_access_key_id
  aws_secret_access_key:
    file: ${HOME}/.aws-agent-secrets/aws_secret_access_key
  aws_session_token:
    file: ${HOME}/.aws-agent-secrets/aws_session_token
  gcp_claude_code_key:
    file: ${HOME}/.gcp-agent-secrets/claude-code-key.json
